# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
#
# 🔗 Links:
# EAS Build docs: https://docs.expo.dev/eas-update/github-actions/

# ✍️ Description:
# Composite action: trigger EAS Build for Android and/or iOS (prebuild runs on EAS only).
# **App configuration comes from Expo only:** `eas env:pull` syncs EAS Environment Variables to
# `.env.${APP_ENV}` on the runner (GitHub does not hold API_URL, Google keys, etc.—only `EXPO_TOKEN`
# is passed from GitHub for Expo API auth).
# Inputs:
#   `APP_ENV` — development | staging | production (must match `mobile/package.json` build scripts / EAS profile).
#   `AUTO_SUBMIT_IOS` / `AUTO_SUBMIT_ANDROID` — pass `--auto-submit` when true.
#   `EXPO_TOKEN` — Expo access token (https://expo.dev/settings/access-tokens).
#   `VERSION` — label used in the EAS build message.
#   `ANDROID` / `IOS` — enable each platform build.
#
# Pull map: staging → preview, production → production, development → development (matches eas.json `environment`).
# Expo **Secret** visibility vars are not included in `env:pull` — use **Sensitive** or plaintext for keys
# required at `expo config` time. https://docs.expo.dev/eas/environment-variables/
# `STACKS_SKIP_ENV_VALIDATE=1` only for `eas env:pull`: the CLI loads app.config.ts before writing `.env`;
# env.js would otherwise fail validation (chicken-and-egg). Build steps do not set this flag.

# 👀 Example usage:
#      - name: ⏱️ EAS Build
#        uses: ./.github/actions/eas-build
#        with:
#          APP_ENV: production
#          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
#          VERSION: ${{ github.sha }}
#          IOS: false

name: 'Setup EAS Build + Trigger Build'
description: 'Setup EAS Build + Trigger Build'
inputs:
  APP_ENV:
    description: 'APP_ENV (one of): development, staging, production'
    required: true
    default: 'staging'
  AUTO_SUBMIT_IOS:
    description: 'Auto-submit iOS build to TestFlight/App Store (one of): true, false'
    required: true
    default: 'false'
  AUTO_SUBMIT_ANDROID:
    description: 'Auto-submit Android build to Play Store (one of): true, false'
    required: true
    default: 'false'
  ANDROID:
    description: 'run for ANDROID (one of): true, false'
    required: true
    default: 'true'
  VERSION:
    description: 'VERSION'
    required: true
    default: '0.0.0'
  IOS:
    description: 'run for IOS (one of): true, false'
    required: true
    default: 'false'
  EXPO_TOKEN:
    description: 'EXPO_TOKEN'
    required: true
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: 💯 Check for EXPO_TOKEN
      run: |
        if [ -z "${{ inputs.EXPO_TOKEN }}" ]; then
          echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
          exit 1
        fi
      shell: bash

    - name: 📦 Setup Expo and EAS
      uses: expo/expo-github-action@v8
      with:
        eas-version: latest
        token: ${{ inputs.EXPO_TOKEN }}

    - name: 🔐 Pull EAS env for expo config on runner
      env:
        STACKS_SKIP_ENV_VALIDATE: '1'
      run: |
        case "${{ inputs.APP_ENV }}" in
          staging) EAS_ENV=preview ;;
          production) EAS_ENV=production ;;
          development) EAS_ENV=development ;;
          *)
            echo "Unsupported APP_ENV for EAS env pull: ${{ inputs.APP_ENV }}"
            exit 1
            ;;
        esac
        # EAS CLI defaults --path to .env.local; CI expects .env then renames to .env.${APP_ENV}.
        eas env:pull --environment "$EAS_ENV" --non-interactive --path .env
        test -f .env || { echo "eas env:pull did not create .env — check EXPO_TOKEN and EAS variables for environment: $EAS_ENV"; exit 1; }
        mv .env ".env.${{ inputs.APP_ENV }}"
        f=".env.${{ inputs.APP_ENV }}"
        n=$(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$f" 2>/dev/null | wc -l | tr -d ' ')
        if [ "${n:-0}" -lt 1 ]; then
          echo "After eas env:pull, $f has no KEY=value lines."
          echo "In Expo → Environment variables, each name must include the **$EAS_ENV** environment (staging CI uses preview; production CI uses production)."
          exit 1
        fi
        echo "Pulled $n variable lines into $f (values not shown)."
      working-directory: mobile
      shell: bash

    - name: 📱 Run Android Build
      if: ${{ inputs.ANDROID == 'true' }}
      run: pnpm build:${{ inputs.APP_ENV }}:android --non-interactive ${{ inputs.AUTO_SUBMIT_ANDROID == 'true' && '--auto-submit' || '' }} --message "Build ${{ inputs.APP_ENV }} ${{ inputs.VERSION }}"
      working-directory: mobile
      shell: bash

    - name: 📱 Run IOS Build
      if: ${{ inputs.IOS == 'true' }}
      run: pnpm build:${{ inputs.APP_ENV }}:ios --non-interactive --clear-cache ${{ inputs.AUTO_SUBMIT_IOS == 'true' && '--auto-submit' || '' }} --message "Build ${{ inputs.APP_ENV }} ${{ inputs.VERSION }}"
      working-directory: mobile
      shell: bash
